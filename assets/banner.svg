<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Dynamic Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1; #3b82f6; #8b5cf6; #6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #ec4899; #06b6d4; #a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #10b981; #6366f1; #06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .bg-rect { fill: url(#bgGrad); }
    .pulse-orb { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .tech-line { stroke: url(#accentGrad); stroke-width: 1.5; stroke-dasharray: 8, 8; opacity: 0.4; animation: dashMove 10s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #94a3b8; }
    .badge-pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #67e8f9; }
  </style>

  <!-- Background Base -->
  <rect class="bg-rect" width="880" height="280" rx="16" />

  <!-- Background Dynamic Glowing Orbs -->
  <circle class="pulse-orb" cx="150" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#softGlow)" />
  <circle class="pulse-orb" cx="730" cy="200" r="140" fill="#ec4899" opacity="0.12" filter="url(#softGlow)" />
  <circle class="pulse-orb" cx="440" cy="140" r="90" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)" />

  <!-- Dynamic Tech Waves & Lines -->
  <path class="tech-line" d="M -50 220 Q 200 120 440 220 T 930 180" fill="none" />
  <path class="tech-line" d="M -50 80 Q 250 180 500 80 T 930 100" fill="none" />

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="220" cy="60" r="4" fill="#a855f7" />
  <circle class="particle-2" cx="680" cy="90" r="5" fill="#38bdf8" />
  <circle class="particle-3" cx="790" cy="220" r="3" fill="#f472b6" />
  <circle class="particle-1" cx="110" cy="210" r="3" fill="#818cf8" />

  <!-- Glassmorphism Container Card -->
  <rect x="40" y="35" width="800" height="210" rx="12" fill="#000000" fill-opacity="0.25" stroke="url(#accentGrad)" stroke-width="1.5" />

  <!-- Foreground Badge -->
  <rect x="70" y="65" width="220" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" />
  <text x="180" y="82" text-anchor="middle" class="badge-pill">🤖 AI CUSTOMER SUPPORT 🤖</text>

  <!-- Foreground Main Title (High Contrast & Clear) -->
  <text x="70" y="135" class="title-text">Awesome AI Customer Support Agent</text>

  <!-- Title Accent Underline -->
  <rect x="70" y="148" width="560" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Foreground Subtitle -->
  <text x="70" y="185" class="subtitle-text">Curated Ecosystem of SaaS Platforms, RAG Bots &amp; Open-Source Helpdesk Agents</text>

  <!-- Footer Tagline -->
  <text x="70" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
    ⚡ Updated September 2026 • Live Chat, Ticket Deflection, Knowledge RAG &amp; AI Copilots
  </text>
</svg>
